<!doctype html>
<script src="cordova.js"></script>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' data: blob: https:;
                 connect-src 'self' https://tyradex.app https://tyradex.vercel.app;
                 img-src 'self' data: https:;
                 style-src 'self' 'unsafe-inline';
                 script-src 'self' 'unsafe-eval' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Pokemon</title>
    <style>
        :root{
          --bg1:#fff0f6;         /* rose très pâle */
          --bg2:#f0f9ff;         /* bleu pastel */
          --card:#ffffffcc;      /* carte "glass" */
          --border:#f9c5d5;      /* rose clair */
          --text:#4b5563;        /* gris foncé */
          --muted:#6b7280;
          --primary:#fb82b7;     /* rose bonbon */
          --success:#22c55e;
          --error:#ef4444;
          --radius:16px;
          --shadow:0 10px 25px rgba(251,130,183,.25);
        }

        body{
          margin:0;
          font-family: system-ui, -apple-system, Roboto, Arial, sans-serif;
          color:var(--text);
          background:
            radial-gradient(800px 400px at -10% -10%, #ffe0ea 0%, transparent 60%),
            radial-gradient(600px 400px at 110% -10%, #e8e5ff 0%, transparent 55%),
            linear-gradient(180deg, var(--bg1), var(--bg2));
          min-height:100vh;
        }

        .topbar{
          position: sticky; top:0; z-index:10;
          display:flex; gap:.6rem; padding:.7rem .9rem;
          border-bottom:1px solid var(--border);
          background:linear-gradient(180deg, #fff, #fff8fb);
        }
        .topbar button{
          padding:.55rem 1rem;
          border-radius:999px;
          border:1px solid var(--border);
          background:#fff;
          color:var(--text);
          cursor:pointer;
          transition: transform .12s ease, background .2s ease;
        }
        .topbar button:hover{
          transform: translateY(-1px);
          background:#fff0f7;
        }

        .route{ display:none; padding:1rem; }
        .route.active{ display:block; }

        h1, h2{ margin-top:0; }
        h1{ color:var(--primary); }
        h2{ color:var(--primary); }

        #quizCard, #finalCard{
          display:flex; flex-direction:column; gap:1rem;
          background: var(--card);
          border:1px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          padding: 18px;
        }

        .poke-img-wrapper{
          display:flex; justify-content:center; align-items:center;
          height:240px; margin: .5rem 0 1rem;
          border-radius: calc(var(--radius) - 6px);
          background: linear-gradient(180deg, #fff, #fff5fb);
          border:1px dashed #f6cfe3;
        }
        #pokeImg{
          max-height:100%; max-width:100%;
          filter: grayscale(1) contrast(1.05);
        }

        form{ display:flex; gap:.6rem; flex-wrap:wrap; }
        input, button{
          font-size:1rem; padding:.7rem 1rem; border-radius:12px; border:1px solid var(--border);
        }
        input{
          flex:1 1 220px; background:#fff; color:var(--text);
        }
        input::placeholder{ color:#a1a1aa; }
        input:focus{
          outline:none;
          border-color: var(--primary);
          box-shadow: 0 0 0 3px rgba(251,130,183,.2);
        }

        button{ background:#fff; cursor:pointer; }
        button:hover{ background:#fff0f7; }

        #startBtn,
        #answerForm button,
        #saveForm button {
          border-color: transparent;
          background: var(--primary);
          color: #571a30;
          font-weight: 700;
          box-shadow: 0 6px 14px rgba(251, 130, 183, .25);
          transition: background .2s ease, color .2s ease;
        }
        #startBtn:hover,
        #answerForm button:hover,
        #saveForm button:hover {
          background: #ff99cc;
          color: #fff;
        }

        #feedback{ min-height:1.25rem; font-weight:700; }
        #feedback.ok{ color: var(--success); }
        #feedback.ko{ color: var(--error); }

        #leaderList{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
        #leaderList li{
          background: #fffafd;
          border:1px solid var(--border);
          border-radius:12px; padding:10px 12px;
        }
        #leaderList li::before{ content:"🌸"; margin-right:.5rem; }
    </style>
</head>
<body>
<nav class="topbar">
    <button data-link="#/" class="is-active">Accueil</button>
    <button data-link="#/quiz">Quiz</button>
    <button data-link="#/leaderboard">Classement</button>
</nav>

<main id="app" class="stack">
    <!-- Accueil -->
    <section data-route="/" class="route active">
        <div class="card">
            <h1>PokeQuiz</h1>
            <p>Trouvez les 10 Pokémons et sauvegardez votre score.</p>
            <button id="startBtn" class="btn-primary">Deviner</button>
        </div>
    </section>

    <!-- Quiz -->
    <section data-route="/quiz" class="route">
        <div class="card" id="quizCard">
            <div class="poke-img-wrapper">
                <img id="pokeImg" src="" alt="Pokémon mystère" />
            </div>
            <div class="progressbar"><div id="pb"></div></div>
            <form id="answerForm">
                <input id="answerInput" type="text" placeholder="Nom" autocomplete="off" />
                <button type="submit" class="btn-primary">Confirmer</button>
            </form>
            <p id="feedback"></p>
            <p id="progress">Question <span id="qIndex">0</span>/10 — Score : <span id="score">0</span></p>
        </div>

        <div class="card hidden" id="finalCard">
            <h2>Résultat : <span id="finalScore"></span>/10</h2>
            <p>Temps : <span id="finalTime"></span></p>
            <form id="saveForm">
                <input id="playerName" type="text" placeholder="Pseudo" required />
                <button type="submit" class="btn-primary">Sauvegarder</button>
            </form>
            <button id="retryBtn">Rejouer</button>
        </div>
    </section>

    <!-- Classement -->
    <section data-route="/leaderboard" class="route">
        <div class="card">
            <h2>Top 5</h2>
            <ol id="leaderList" class="mt-3"></ol>
        </div>
    </section>
</main>

<script>
    function vibrate(pattern){
      try {
        if (window.AdvancedVibration && typeof AdvancedVibration.vibratePattern === 'function') {
          AdvancedVibration.vibratePattern(pattern, ()=>{}, ()=>{});
          return;
        }
      } catch(e) { /* ignore */ }
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    /* ---------- Router + active button state ---------- */
    function setActiveBtn(hash){
      document.querySelectorAll('.topbar button[data-link]').forEach(b=>b.classList.remove('is-active'));
      const btn = document.querySelector(`.topbar button[data-link="${hash}"]`);
      if (btn) btn.classList.add('is-active');
    }

    function render(current = window.location.hash || '#/') {
      const route = current.replace('#','');
      document.querySelectorAll('.route').forEach(s => s.classList.remove('active'));
      (document.querySelector('[data-route="'+route+'"]') || document.querySelector('[data-route="/"]')).classList.add('active');
      setActiveBtn('#'+route);
      if (route === '/leaderboard') renderLeaderboard();
    }

    function navigate(hash) { window.location.hash = hash; render(hash); }

    /* ---------- Utils ---------- */
    const API_BASE = 'https://tyradex.app/api/v1/pokemon';
    const QUESTIONS = 10, MAX_ID = 1025;

    const randInt = (min, max) => Math.floor(Math.random()*(max-min+1))+min;
    function normalizeName(s=''){
      return s.toString().trim().toLowerCase()
        .normalize('NFD').replace(/\p{Diacritic}/gu,'')
        .replace(/[^a-z0-9\- ]/g,' ').replace(/\s+/g,' ');
    }
    const fmtTime = s => `${Math.floor(s/60)}m${String(s%60).padStart(2,'0')}s`;

    /* ---------- Storage (File plugin si dispo, sinon localStorage) ---------- */
    const FILE_NAME = 'scores.json';
    let fsDir = null;
    function hasCordovaFS(){ return !!(window.cordova && window.resolveLocalFileSystemURL && window.cordova.file && cordova.file.dataDirectory); }
    async function ensureDir(){
      if (!hasCordovaFS()) throw new Error('no-file');
      return new Promise((res, rej)=>{
        if (fsDir) return res(fsDir);
        window.resolveLocalFileSystemURL(cordova.file.dataDirectory, e=>{ fsDir=e; res(e); }, rej);
      });
    }
    async function readScores(){
      if (hasCordovaFS()){
        try{
          const dir = await ensureDir();
          return await new Promise((resolve,reject)=>{
            dir.getFile(FILE_NAME, {create:true}, fe=>{
              fe.file(file=>{
                const r=new FileReader();
                r.onloadend=()=>{ try{ resolve(r.result?JSON.parse(r.result):[]); } catch{ resolve([]);} };
                r.readAsText(file);
              }, reject);
            }, reject);
          });
        } catch { /* fallback */ }
      }
      return JSON.parse(localStorage.getItem('scores')||'[]');
    }
    async function writeScores(arr){
      if (hasCordovaFS()){
        try{
          const dir = await ensureDir();
          return await new Promise((resolve,reject)=>{
            dir.getFile(FILE_NAME, {create:true}, fe=>{
              fe.createWriter(w=>{
                w.onwriteend=resolve; w.onerror=reject;
                const blob = new Blob([JSON.stringify(arr,null,2)], {type:'application/json'});
                w.truncate(0); setTimeout(()=>w.write(blob), 10);
              }, reject);
            }, reject);
          });
        } catch { /* fallback */ }
      }
      localStorage.setItem('scores', JSON.stringify(arr));
    }
    async function pushScore(rec){
      const arr = await readScores();
      arr.push(rec);
      arr.sort((a,b)=> b.score - a.score || a.timeSec - b.timeSec || (a.date||'').localeCompare(b.date||''));
      await writeScores(arr);
      return arr;
    }
    async function topN(n=5){
      const arr = await readScores();
      arr.sort((a,b)=> b.score - a.score || a.timeSec - b.timeSec);
      return arr.slice(0,n);
    }

    /* ---------- Quiz state ---------- */
    const state = { index:0, score:0, startTs:0, current:null };

    async function fetchPokemon(id){
      const res = await fetch(`${API_BASE}/${id}`);
      if (!res.ok) throw new Error('API '+res.status);
      const data = await res.json();
      const name = (data?.name?.fr) || (data?.name?.en) || data?.name || '';
      const imageUrl = data?.sprites?.regular || data?.sprites?.default || data?.image || '';
      return { id, name, imageUrl };
    }

    function updateProgress(){
      const pct = Math.min(100, Math.max(0, (state.index/QUESTIONS)*100));
      const el = document.getElementById('pb');
      if (el) el.style.width = pct + '%';
      document.getElementById('qIndex').textContent = String(Math.min(state.index, QUESTIONS));
    }

    async function nextQuestion(){
      if (state.index >= QUESTIONS) return showFinal();
      document.getElementById('feedback').className='';
      document.getElementById('feedback').textContent='';
      document.getElementById('answerInput').value='';
      document.getElementById('qIndex').textContent = String(state.index+1);

      let poke=null;
      for (let tries=0; tries<5 && !poke; tries++){
        try{
          const p = await fetchPokemon(randInt(1, MAX_ID));
          if (p.imageUrl) poke=p;
        }catch{}
      }
      if (!poke){ document.getElementById('feedback').textContent="Erreur de chargement. Réessaie."; return; }

      state.current = poke;
      const img = document.getElementById('pokeImg');
      img.style.filter = 'grayscale(1) contrast(1.08) brightness(.98) drop-shadow(0 15px 25px rgba(0,0,0,.35))';
      img.src = poke.imageUrl;
      updateProgress();
    }

    function onSubmitAnswer(e){
      e.preventDefault();
      if (!state.current) return;
      const guess = normalizeName(document.getElementById('answerInput').value);
      const correct = normalizeName(state.current.name);
      const ok = guess && correct && (guess === correct);
      const fb = document.getElementById('feedback');

      if (ok){
        state.score++;
        fb.textContent = `✅ Bravo ! C'était ${state.current.name}.`;
        fb.className='ok';
        vibrate([200]);  
        document.getElementById('pokeImg').style.filter = 'grayscale(0) contrast(1) drop-shadow(0 15px 25px rgba(0,0,0,.35))';
      } else {
        fb.textContent = `❌ Raté. C'était ${state.current.name}.`;
        fb.className='ko';
        vibrate([200,100,200]); 
      }
      document.getElementById('score').textContent = String(state.score);
      state.index++;
      updateProgress();
      setTimeout(nextQuestion, 800);
    }

    function showFinal(){
      const elapsedSec = Math.round((Date.now() - state.startTs)/1000);
      document.getElementById('finalScore').textContent = String(state.score);
      document.getElementById('finalTime').textContent = fmtTime(elapsedSec);
      document.getElementById('quizCard').classList.add('hidden');
      document.getElementById('finalCard').classList.remove('hidden');

      document.getElementById('saveForm').onsubmit = async (e)=>{
        e.preventDefault();
        const player = (document.getElementById('playerName').value || 'Anon').trim();
        await pushScore({ player, score: state.score, timeSec: elapsedSec, date: new Date().toISOString() });
        navigate('#/leaderboard');
      };
      vibrate([200,100,200,100,200]);
    }

    function resetQuiz(){
      state.index=0; state.score=0; state.startTs=Date.now(); state.current=null;
      document.getElementById('score').textContent='0';
      document.getElementById('qIndex').textContent='0';
      document.getElementById('feedback').textContent='';
      document.getElementById('finalCard').classList.add('hidden');
      document.getElementById('quizCard').classList.remove('hidden');
      updateProgress();
      nextQuestion();
    }

    async function renderLeaderboard(){
      const list = document.getElementById('leaderList'); list.innerHTML='';
      const top = await topN(5);
      if (top.length===0){ list.innerHTML = '<li>Aucun score pour le moment.</li>'; return; }
      top.forEach((r,i)=>{
        const li=document.createElement('li');
        li.textContent = `${i+1}. ${r.player} — ${r.score}/10 — ${r.timeSec}s`;
        list.appendChild(li);
      });
    }

    /* ---------- Bootstrap ---------- */
    function onReady(){
      // router
      window.addEventListener('hashchange', ()=>render());
      render();

      // nav
      document.querySelectorAll('nav [data-link]').forEach(b=>{
        b.addEventListener('click', ()=>navigate(b.getAttribute('data-link')));
      });

      // accueil
      document.getElementById('startBtn').addEventListener('click', ()=>{ navigate('#/quiz'); resetQuiz(); });

      // quiz
      document.getElementById('answerForm').addEventListener('submit', onSubmitAnswer);
      document.getElementById('retryBtn').addEventListener('click', ()=>{ navigate('#/quiz'); resetQuiz(); });
    }

    document.addEventListener('deviceready', onReady, false);
    if (document.readyState === 'complete') onReady(); else window.addEventListener('load', onReady);

    function resetQuizUI(){
      // cartes
      document.getElementById('finalCard').classList.add('hidden');
      document.getElementById('quizCard').classList.remove('hidden');

      // champs/labels
      const fb = document.getElementById('feedback');
      fb.textContent = '';
      fb.className = '';

      document.getElementById('answerInput').value = '';
      document.getElementById('playerName').value = '';

      // progress & compteurs
      document.getElementById('score').textContent = '0';
      document.getElementById('qIndex').textContent = '0';
      const pb = document.getElementById('pb'); if (pb) pb.style.width = '0%';

      // résultats finaux (placeholders)
      document.getElementById('finalScore').textContent = '0';
      document.getElementById('finalTime').textContent = '0m00s';
    }

    function resetQuiz(){
      state.index=0; state.score=0; state.startTs=Date.now(); state.current=null;
      resetQuizUI();        // <-- important
      nextQuestion();
    }

    function render(current = window.location.hash || '#/') {
      const route = current.replace('#','');
      document.querySelectorAll('.route').forEach(s => s.classList.remove('active'));
      (document.querySelector('[data-route="'+route+'"]') || document.querySelector('[data-route="/"]')).classList.add('active');
      setActiveBtn('#'+route);

      if (route === '/leaderboard') {
        renderLeaderboard();
      }
      if (route === '/quiz') {
        // Si on revient sur l'écran Quiz, s'assurer que l'ancien résultat n'apparaît pas
        resetQuiz();
      }
    }
</script>
</body>
</html>
